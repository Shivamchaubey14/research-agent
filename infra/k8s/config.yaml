# Non-secret service wiring. Hostnames are the in-cluster Service names below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dr-config
data:
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  QDRANT_URL: http://qdrant:6333
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "*"
  MYSQL_DATABASE: research
---
# Secrets. These are PLACEHOLDERS — replace before applying (or, in production,
# source them from a real secret manager / sealed-secrets, never commit real
# values). DATABASE_URL embeds the MySQL password (so it lives here, not config).
apiVersion: v1
kind: Secret
metadata:
  name: dr-secrets
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "CHANGEME-long-random-string"
  GROQ_API_KEY: "CHANGEME"
  # Optional: enables the agent's web_search tool. Leave blank to run without it.
  TAVILY_API_KEY: ""
  MYSQL_ROOT_PASSWORD: "root@123"
  DATABASE_URL: "mysql://root:root%40123@mysql:3306/research"
