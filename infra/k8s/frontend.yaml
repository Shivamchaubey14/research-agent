apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 5173
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/shivamchaubey14/research-agent-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          # Same-origin API path: requests go to /api on the ingress host, which
          # routes to the backend. (A production image would bake this at build.)
          env:
            - name: VITE_API_URL
              value: /api
