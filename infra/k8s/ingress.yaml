apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deepresearch
  annotations:
    # SSE: disable response buffering and allow long-lived connections so live
    # progress streams through (FR-STR-1).
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: deepresearch.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5173
