# The worker tier scales independently of the API (NFR — independent worker
# scaling): a Deployment plus a CPU-based HorizontalPodAutoscaler. No Service —
# the worker is a Kafka consumer, not an HTTP server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/shivamchaubey14/research-agent-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dr-config
            - secretRef:
                name: dr-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
