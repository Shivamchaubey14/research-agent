name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, check, test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root@123
          MYSQL_DATABASE: research
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot@123"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:root%40123@127.0.0.1:3306/research
      DJANGO_SECRET_KEY: ci-insecure-key-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Django system check
        working-directory: backend
        run: python manage.py check
      - name: Tests
        working-directory: backend
        run: python manage.py test

  worker:
    name: Worker — lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # The unit tests only exercise the worker's pure-logic modules (chunking,
      # depth profiles, agent schema), so they need pydantic + the LLM SDKs the
      # agent package imports — not the full Kafka/Redis/Qdrant stack.
      - name: Install dependencies
        run: pip install pydantic groq tavily-python ruff
      - name: Lint (ruff)
        run: ruff check worker
      - name: Tests
        run: python -m unittest discover -s worker/tests -t . -p "test_*.py"

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
